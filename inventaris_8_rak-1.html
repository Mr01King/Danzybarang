<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f35">
<title>Inventaris 8 Rak</title>
<style>
:root{--green:#173f35;--mint:#e8f2ed;--bg:#f5f7f5;--ink:#1c2924;--muted:#718078;--line:#e2e9e4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
header{background:var(--green);color:white;padding:22px 18px 25px;border-radius:0 0 24px 24px}
header h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:#d3e4dc;font-size:13px}
main{max-width:760px;margin:auto;padding:17px}
.search{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;font-size:15px;background:white;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:16px}
.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;cursor:pointer;box-shadow:0 2px 8px #102b1c0a}
.photo{height:125px;background:linear-gradient(135deg,#e7eee9,#d7e3dc);display:flex;align-items:center;justify-content:center;color:#789084;font-size:40px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}.cardbody{padding:12px}.cardbody b{display:block;font-size:15px}.cardbody small{color:var(--muted)}
.toprow{display:flex;align-items:center;gap:10px;margin:4px 0 16px}.back{border:0;background:white;border-radius:11px;padding:10px 13px;font-size:16px}
h2{font-size:20px;margin:0}.sub{font-size:13px;color:var(--muted);margin:4px 0 14px}
.btn{border:0;border-radius:11px;background:var(--green);color:white;padding:11px 14px;font-weight:650;cursor:pointer}.btn.light{background:var(--mint);color:var(--green)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.item{display:flex;gap:12px;background:white;padding:11px;border:1px solid var(--line);border-radius:14px;margin:10px 0;align-items:center}
.item img,.placeholder{width:68px;height:68px;border-radius:10px;object-fit:cover;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.iteminfo{min-width:0;flex:1}.iteminfo b{display:block;overflow-wrap:anywhere}.iteminfo small{color:var(--muted)}
.itemactions{display:flex;gap:6px}.iconbtn{border:0;background:var(--mint);color:var(--green);border-radius:9px;padding:8px;cursor:pointer}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin:14px 0}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}
input,textarea{font:inherit}input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}
input[type=file]{width:100%;font-size:13px}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:30px 10px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:22px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.photo{height:145px}}
</style>
</head>
<body>
<header><h1>Inventaris Apotek</h1><p>Kelola barang berdasarkan lokasi rak</p></header>
<main>
<section id="home">
  <input id="globalSearch" class="search" placeholder="Cari nama barang di semua rak...">
  <div id="searchResults" class="hidden"></div>
  <div id="rackGrid" class="grid"></div>
</section>
<section id="rackPage" class="hidden">
  <div class="toprow"><button class="back" id="backBtn">←</button><div><h2 id="rackTitle">Rak 1</h2><div class="sub" id="rackDesc">Daftar barang di rak</div></div></div>
  <div class="panel">
    <b>Foto lokasi rak</b>
    <div class="photo" id="rackPhoto" style="height:155px;border-radius:12px;margin:10px 0">🗄️</div>
    <label for="rackImage">Tambah / ganti foto rak</label><input id="rackImage" type="file" accept="image/*">
  </div>
  <input id="rackSearch" class="search" placeholder="Cari barang di rak ini...">
  <div class="actions"><button class="btn" id="addBtn">＋ Tambah barang</button></div>
  <div id="itemList"></div>
</section>
<section id="formPage" class="hidden">
  <div class="toprow"><button class="back" id="cancelBtn">←</button><div><h2 id="formTitle">Tambah barang</h2><div class="sub" id="formRackName"></div></div></div>
  <div class="panel">
    <label>Nama barang *</label><input id="itemName" type="text" placeholder="Contoh: Paracetamol 500 mg">
    <label>Harga (Rp)</label><input id="itemPrice" type="number" min="0" placeholder="Contoh: 5000">
    <label>Stok</label><input id="itemStock" type="number" min="0" placeholder="Contoh: 20">
    <label>Foto barang</label><input id="itemImage" type="file" accept="image/*">
    <div class="actions"><button class="btn" id="saveBtn">Simpan barang</button><button class="btn light" id="cancelFormBtn">Batal</button></div>
  </div>
</section>
</main>
<footer>Data disimpan di browser perangkat ini. Ekspor/cadangkan data secara berkala.</footer>
<script>
const KEY='inventaris8rak_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||Array.from({length:8},(_,i)=>({name:`Rak ${i+1}`,photo:'',items:[]}));
let current=0,editing=null;
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Penyimpanan penuh. Coba gunakan foto yang lebih kecil.');}}
function show(id){['home','rackPage','formPage'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function imgMarkup(src,alt=''){return src?`<img src="${src}" alt="${alt}">`:'🗄️';}
function renderRacks(){
 $('rackGrid').innerHTML=data.map((r,i)=>`<button class="card" data-rack="${i}"><div class="photo">${r.photo?`<img src="${r.photo}" alt="Foto ${r.name}">`:'🗄️'}</div><div class="cardbody"><b>${esc(r.name)}</b><small>${r.items.length} barang</small></div></button>`).join('');
 $('rackGrid').querySelectorAll('[data-rack]').forEach(b=>b.onclick=()=>openRack(+b.dataset.rack));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openRack(i){current=i;$('rackTitle').textContent=data[i].name;$('rackDesc').textContent=`${data[i].items.length} barang tersimpan`;$('rackPhoto').innerHTML=data[i].photo?`<img src="${data[i].photo}" alt="Foto rak" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'🗄️';$('rackImage').value='';$('rackSearch').value='';renderItems();show('rackPage');}
function renderItems(){
 const q=$('rackSearch').value.toLowerCase();
 const arr=data[current].items.map((it,i)=>({...it,_i:i})).filter(it=>it.name.toLowerCase().includes(q));
 $('itemList').innerHTML=arr.length?arr.map(it=>`<div class="item">${it.photo?`<img src="${it.photo}" alt="">`:'<div class="placeholder">📦</div>'}<div class="iteminfo"><b>${esc(it.name)}</b><small>Rp ${Number(it.price||0).toLocaleString('id-ID')} · Stok: ${Number(it.stock||0)}</small></div><div class="itemactions"><button class="iconbtn" data-edit="${it._i}" aria-label="Edit">✎</button><button class="iconbtn" data-del="${it._i}" aria-label="Hapus">✕</button></div></div>`).join(''):'<div class="empty">Belum ada barang di rak ini.</div>';
 $('itemList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(+b.dataset.edit));
 $('itemList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let n=+b.dataset.del;if(confirm('Hapus barang ini?')){data[current].items.splice(n,1);persist();renderItems();renderRacks();}});
}
function openForm(index=null){editing=index;$('formTitle').textContent=index===null?'Tambah barang':'Edit barang';$('formRackName').textContent=data[current].name;let it=index===null?{name:'',price:'',stock:'',photo:''}:data[current].items[index];$('itemName').value=it.name;$('itemPrice').value=it.price;$('itemStock').value=it.stock;$('itemImage').value='';show('formPage');}
function readImage(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78));};im.onerror=reject;im.src=reader.result;};reader.onerror=reject;reader.readAsDataURL(file);});}
$('rackImage').onchange=async e=>{try{const v=await readImage(e.target.files[0]);if(v){data[current].photo=v;persist();openRack(current);renderRacks();}}catch{alert('Foto tidak bisa dibuka.');}};
$('saveBtn').onclick=async()=>{const name=$('itemName').value.trim();if(!name){alert('Isi nama barang dulu.');return;}const old=editing===null?{}:data[current].items[editing];try{const chosen=$('itemImage').files[0];const photo=chosen?await readImage(chosen):(old.photo||'');const item={name,price:Number($('itemPrice').value||0),stock:Number($('itemStock').value||0),photo};if(editing===null)data[current].items.push(item);else data[current].items[editing]=item;persist();openRack(current);renderRacks();}catch{alert('Foto gagal diproses. Coba foto lain.');}};
$('addBtn').onclick=()=>openForm();$('backBtn').onclick=()=>{show('home');renderRacks();};$('cancelBtn').onclick=$('cancelFormBtn').onclick=()=>openRack(current);$('rackSearch').oninput=renderItems;
$('globalSearch').oninput=()=>{const q=$('globalSearch').value.trim().toLowerCase();$('rackGrid').classList.toggle('hidden',!!q);$('searchResults').classList.toggle('hidden',!q);if(!q)return;let found=[];data.forEach((r,ri)=>r.items.forEach((it,ii)=>{if(it.name.toLowerCase().includes(q))found.push({r,ri,it,ii});}));$('searchResults').innerHTML=found.length?found.map(x=>`<div class="item" data-go="${x.ri}">${x.it.photo?`<img src="${x.it.photo}" alt="">`:'<div class="placeholder">📦</div>'}<div class="iteminfo"><b>${esc(x.it.name)}</b><small>${esc(x.r.name)} · Rp ${Number(x.it.price||0).toLocaleString('id-ID')} · Stok ${x.it.stock}</small></div></div>`).join(''):'<div class="empty">Barang tidak ditemukan.</div>';$('searchResults').querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>openRack(+el.dataset.go));};
renderRacks();
</script>
</body></html>
